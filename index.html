<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>몽글 Pop Pop!</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Press+Start+2P&display=swap">
<style>
/* Version picker: logo, then one card per game version */
:root {
  color-scheme: dark;
  --bg: #0d0b1f;
  --panel: #17142f;
  --line: #2e2858;
  --fg: #ece8ff;
  --muted: #a09ac9;
  --mint: #5fe3b0;
  --peach: #ffb36b;
  --display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --pixel: "Press Start 2P", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; margin: 0; }
body {
  background: var(--bg) radial-gradient(circle at 50% 0%, #1d1844 0%, var(--bg) 60%) no-repeat;
  color: var(--fg);
  font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(40px, env(safe-area-inset-top, 0px)) 40px;
  display: flex; flex-direction: column; align-items: center; gap: 28px;
}
header { text-align: center; display: grid; gap: 10px; }
h1 { margin: 0; font-family: var(--pixel); font-weight: 400; font-size: clamp(1.4rem, 6vw, 2.6rem); line-height: 1.3; text-wrap: balance; }
h1 b { color: var(--mint); font-weight: 400; display: block; }
h1 i { color: var(--peach); font-style: normal; }
header p { margin: 0; color: var(--muted); font-size: 1rem; }
.cards { width: min(100%, 720px); display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.card {
  display: grid; gap: 8px; align-content: start;
  background: var(--panel); border: 2px solid var(--line); border-radius: 16px;
  padding: 18px 20px; color: inherit; text-decoration: none; min-width: 0;
}
a.card:hover, a.card:focus-visible { border-color: var(--mint); outline: none; transform: translateY(-2px); }
.card { transition: transform .15s, border-color .15s; }
.tag { font-family: var(--pixel); font-size: .6rem; color: var(--mint); letter-spacing: .05em; }
.card.soon .tag { color: var(--muted); }
.card h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.5rem; }
.card p { margin: 0; color: var(--muted); line-height: 1.6; font-size: .95rem; }
.go { margin-top: 6px; font-family: var(--display); font-size: 1.1rem; color: var(--mint); }
.card.soon { opacity: .7; border-style: dashed; }
.card.soon .go { color: var(--muted); }
footer { color: var(--muted); font-size: .85rem; text-align: center; }
footer a { color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>
</head>
<body>
<header>
  <h1><b>MONGLE</b><i>POP POP!</i></h1>
  <p>거품으로 적을 가두고 터뜨려 말랑한 젤리를 모으는 게임</p>
</header>

<main class="cards">
  <a class="card" href="v1/">
    <span class="tag">VER 1</span>
    <h2>기본 게임</h2>
    <p>맵 6개를 끝없이 도는 아케이드 모드예요. 1인 플레이, 한 키보드 2인 협동, 모바일 터치를 지원하고 TOP 10 랭킹이 있어요.</p>
    <span class="go">플레이하기 →</span>
  </a>
  <div class="card soon" aria-disabled="true">
    <span class="tag">VER 2</span>
    <h2>학습 퀴즈 게임</h2>
    <p>가끔 나타나는 물음표 몬스터를 터뜨리면 학습 문제가 나와요. 맞히면 보너스를 받아요.</p>
    <span class="go">준비 중이에요</span>
  </div>
</main>

<footer>몽글 Pop Pop! · 몽이와 글이의 거품 모험</footer>
</body>
</html>
